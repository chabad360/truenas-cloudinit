vm:
    name: coolify_1
    image_id: debian-13-generic-amd64-20260512-2476
    vcpus: 1
    cores: 4
    threads: 1
    memory: 8192
    min_memory: 2048
    disk_dir: /mnt/main/VMs/volumes
    disk_size: 50
    nic: br1
    mac_address: 00:a0:98:48:c3:ec
cloud_init:
    users:
        - name: root
          ssh_authorized_keys:
            - |
              ssh-rsa  coolify-generated-ssh-key
          lock_passwd: false
    packages:
        - qemu-guest-agent
    timezone: America/New_York
    ssh_pwauth: true
    hostname: coolify-1
    disable_root: false
